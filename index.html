
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Embed Site</title>

<meta name="theme-color" content="#050505">
<meta name="description" content="My personal embed website">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #050505;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

#viewer {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
    background: black;
}

#loading {
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: #050505;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    transition: opacity .5s ease;
}

#loading.hidden {
    opacity: 0;
    pointer-events: none;
}

#loading h1 {
    font-size: 27px;
    margin-bottom: 10px;
}

#loading p {
    color: #999;
    font-size: 14px;
}

.loader {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 5px;
    background: #222;
    overflow: hidden;
}

.loader::after {
    content: "";
    display: block;
    width: 180px;
    height: 100%;
    background: #00ffa6;
    animation: loading 1.5s infinite linear;
}

@keyframes loading {
    from { transform: translateX(-180px); }
    to { transform: translateX(100vw); }
}

#particles {
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: .3;
}
</style>
</head>

<body>

<canvas id="particles"></canvas>

<div id="loading">
    <h1 id="loadingTitle">Loading...</h1>
    <p id="loadingText">Please wait while the page loads.</p>
    <div class="loader"></div>
</div>

<iframe
    id="viewer"
    src="content.html"
    title="Embedded content"
    allowfullscreen>
</iframe>

<script>
// Loading screen
const viewer = document.getElementById("viewer");
const loading = document.getElementById("loading");

viewer.addEventListener("load", () => {
    loading.classList.add("hidden");
});

// Show a delayed loading message if needed
setTimeout(() => {
    if (!loading.classList.contains("hidden")) {
        document.getElementById("loadingTitle").textContent =
            "Taking longer than expected...";
        document.getElementById("loadingText").textContent =
            "The content may be unavailable.";
    }
}, 10000);

// Particle background
const canvas = document.getElementById("particles");
const ctx = canvas.getContext("2d");

function resize() {
    canvas.width = innerWidth;
    canvas.height = innerHeight;
}

resize();
window.addEventListener("resize", resize);

let particles = [];

for (let i = 0; i < 65; i++) {
    particles.push({
        x: Math.random() * innerWidth,
        y: Math.random() * innerHeight,
        size: Math.random() * 2 + 1,
        speed: Math.random() * .5 + .2
    });
}

function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    particles.forEach(p => {
        ctx.fillStyle = "#00ffa6";
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();

        p.y -= p.speed;

        if (p.y < 0) {
            p.y = canvas.height;
            p.x = Math.random() * canvas.width;
        }
    });

    requestAnimationFrame(animate);
}

animate();
</script>

</body>
</html>
